# Mô phỏng chi phí khi dùng thật — Track C1 (Lập lịch 1 ngày ở khu vui chơi).
# Làm ở guide bước 4.2. Chạy thử 10 phiên trước CP3: python run.py simulate --try
# Bản nộp CP4 (>=50 phiên): python run.py simulate --rate-from eval/run-2.csv

sessions: 50        # số phiên mô phỏng cho bản nộp CP4 (tối thiểu 50)
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # số trưởng nhóm dùng công cụ lập lịch / tháng tại quy mô thật (1 khu vui chơi cỡ lớn)
  low: 3000
  base: 10000
  high: 30000
  source: "Quy đổi từ ~7,9 triệu lượt khách/năm (~658.000 lượt/tháng) của Hong Kong Disneyland theo báo cáo TEA/AECOM 2024 (xem 27/11/2026) chia trung bình 4 người/nhóm (~164.500 nhóm/tháng) và tỉ lệ pain 26,5% (evidence/data-mining.md). Kịch bản cơ sở 10.000 trưởng nhóm/tháng (~6% tổng số nhóm), thấp 3.000 (mùa thấp điểm/khu vừa), cao 30.000 (mùa lễ hoặc nhiều khu): (tự ước tính)"

personas:           # 3 kiểu người dùng Track C1; tổng share = 1.0
  - name: dung_it
    share: 0.50
    uses_per_month: 1
    turns_per_session: 1
    types: [thuong]
    source: "Trưởng nhóm lập lịch 1 lần trước ngày đi rồi chốt dùng (tự ước tính — khớp spec.md §2)"
  - name: dung_vua
    share: 0.35
    uses_per_month: 1
    turns_per_session: 3
    types: [thuong, kho]
    source: "Trưởng nhóm điều chỉnh lịch 2-3 lần theo ngân sách và sở thích của các thành viên trong nhóm (tự ước tính — khớp spec.md §2)"
  - name: dung_nhieu
    share: 0.15
    uses_per_month: 1
    turns_per_session: 5
    types: [kho]
    source: "Trưởng nhóm gặp trời mưa, trò đóng bảo trì hoặc trễ giờ show phải xếp lại lịch nhiều lần trong ngày (tự ước tính — khớp spec.md §2)"

prices:             # USD / 1 triệu token — bảng giá chung K5 (further-reading/model-prices.md, kiểm 25/11/2026)
  - model: gpt-4o-mini
    input: 0.15
    output: 0.60
    source: "https://developers.openai.com/api/docs/pricing · xem 25/11/2026 (tầng Nhỏ)"
  - model: gemini-3.1-flash-lite
    input: 0.25
    output: 1.50
    source: "https://ai.google.dev/gemini-api/docs/pricing · xem 25/11/2026 (tầng Nhỏ)"
  - model: gemini-4-hydrogen
    input: 1.50
    output: 7.50
    source: "https://ai.google.dev/gemini-api/docs/pricing · xem 25/11/2026 (tầng Lớn)"

usd_to_vnd:
  rate: 25400
  source: "Tỷ giá tham khảo USD/VND ~25.400đ · xem 27/11/2026 (tự ước tính làm tròn)"
